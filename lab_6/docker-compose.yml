version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: lab6_postgres
    restart: always
    environment:
      POSTGRES_USER: lab6_user
      POSTGRES_PASSWORD: lab6_password
      POSTGRES_DB: lab6_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab6_user -d lab6_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: lab6_n8n
    restart: always
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./:/files
    environment:
      - GENERIC_TIMEZONE=Europe/Moscow
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  n8n_data: